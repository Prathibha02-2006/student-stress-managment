<!DOCTYPE html>
<html>
<head>
    <title>Challenge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<h2>{{ days }}-Day Stress Challenge{% if session.get('interest') %} ({{ session.get('interest') }}){% endif %}</h2>
<h3>Reminder: {{ message }}</h3>
<div class="challenge-container">
{% for entry in activities %}
    <div class="challenge-card" data-day="{{ entry.day }}">
        <label class="challenge-item">
            <input type="checkbox" class="challenge-checkbox" data-day="{{ entry.day }}" {% if entry.day <= 1 %}data-first="true"{% endif %}>
            <span class="challenge-text">Day {{ entry.day }}: {{ entry.task }}</span>
        </label>
    </div>
{% endfor %}
</div>
<div class="challenge-actions">
    <a href="/challenge_questions" class="btn-complete">Complete Challenge & Take Questionnaire</a>
    <p><a href="/stress">Back to Stress Page</a></p>
</div>
<script>
(function() {
    var storageKey = 'challenge_{{ session.get("username", "guest") }}_{{ days }}_{{ orig_score }}';
    var checkboxes = document.querySelectorAll('.challenge-checkbox');
    
    // Load saved state
    var saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
    checkboxes.forEach(function(cb) {
        var day = cb.getAttribute('data-day');
        if (saved[day]) {
            cb.checked = true;
            cb.closest('.challenge-card').classList.add('completed');
        }
    });
    
    // Save on change
    checkboxes.forEach(function(cb) {
        cb.addEventListener('change', function() {
            var day = this.getAttribute('data-day');
            saved[day] = this.checked;
            localStorage.setItem(storageKey, JSON.stringify(saved));
            this.closest('.challenge-card').classList.toggle('completed', this.checked);
        });
    });
})();
</script>
</body>
</html>
